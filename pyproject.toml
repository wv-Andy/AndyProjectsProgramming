[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: needs internet access, and skips when the target is unreachable",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    # asyncio.TimeoutError is clearer than TimeoutError about what timed out.
    "UP041",
]
